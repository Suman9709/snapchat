{% extends 'index.html' %}

{% block main %}
  <div class="h-full min-h-0 flex flex-col overflow-hidden bg-gray-50">
    <!-- Header -->
    <div class="pt-6 px-5 pb-4 bg-white shadow-sm flex items-center gap-3 flex-shrink-0">
      <a href="{% url 'profile' %}" class="w-10 h-10 rounded-full bg-gray-100 flex items-center justify-center"><i class="fa-solid fa-chevron-left text-gray-700"></i></a>

      <h2 class="text-lg font-bold">Edit Profile</h2>
    </div>

    <!-- Form -->
    <form action="{% url 'update-profile' %}" method="POST" enctype="multipart/form-data" class="flex-1 overflow-y-auto scrollbar-none px-5 py-6 scroll-hidden">
      {% csrf_token %}

      <!-- Profile Image -->

      <div class="flex justify-center">
        <label class="relative cursor-pointer">
          <div class="w-32 h-32 rounded-full overflow-hidden ring-4 ring-yellow-400">
            {% if user.profile_pic %}
              <img id="preview" src="{{ user.profile_pic.url }}" class="w-full h-full object-cover" />
            {% else %}
              <img id="preview" src="https://i.redd.it/ppohcjn7kfl71.jpg" class="w-full h-full object-cover" />
            {% endif %}
          </div>

          <!-- Camera Button -->

          <div class="absolute bottom-1 right-1 w-10 h-10 rounded-full bg-yellow-400 flex items-center justify-center shadow">
            <i class="fa-solid fa-camera"></i>
          </div>

          <input id="profile_pic" type="file" name="profile_pic" accept="image/*" class="hidden" />
        </label>
      </div>

      <!-- Username -->

      <div class="mt-8 bg-white rounded-3xl p-5 shadow-sm">
        <label class="text-sm text-gray-400">Username</label>

        <div class="mt-2 flex items-center gap-3">
          <i class="fa-solid fa-user text-black"></i>

          <input value="{{ user.username }}" disabled class="w-full bg-gray-100 rounded-xl px-4 py-3 text-gray-500" />
        </div>

        <p class="text-xs text-gray-400 mt-2">Username cannot be changed</p>
      </div>

      <!-- Email -->

      <div class="mt-4 bg-white rounded-3xl p-5 shadow-sm">
        <label class="text-sm text-gray-400">Email</label>

        <div class="mt-2 flex items-center gap-3">
          <i class="fa-solid fa-envelope text-black"></i>

          <input name="email" value="{{ user.email }}" class="w-full bg-gray-100 rounded-xl px-4 py-3 outline-none" />
        </div>
      </div>

      <!-- Bio -->

      <div class="mt-4 bg-white rounded-3xl p-5 shadow-sm">
        <label class="text-sm text-gray-400">Bio</label>

        <input name="bio" maxlength="256" value="{{ user.bio }}" rows="3" class="mt-2 w-full bg-gray-100 rounded-xl px-4 py-3 outline-none resize-none" placeholder="Tell something about yourself" />
      </div>

      <!-- Save Button -->

      <button type="submit" class="mt-8 mb-5 w-full py-4 rounded-full bg-yellow-400 hover:bg-yellow-500 font-bold shadow-md">
        <i class="fa-solid fa-check mr-2"></i>

        Save Changes
      </button>
    </form>
  </div>

  <script>
    const input = document.getElementById('profile_pic')
    const preview = document.getElementById('preview')
    
    input.addEventListener('change', () => {
      const file = input.files[0]
    
      if (file) {
        preview.src = URL.createObjectURL(file)
      }
    })
  </script>
{% endblock %}
