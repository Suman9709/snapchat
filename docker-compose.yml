version: "3.9"

services:

  db:
    image: postgres:17
    restart: always

    environment:
      POSTGRES_DB: snapchat_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build: .

    command: python manage.py runserver 0.0.0.0:8000

    volumes:
      - .:/app

    ports:
      - "8000:8000"

    env_file:
      - .env

    environment:
      DB_HOST: db
      DB_PORT: 5432

    depends_on:
      - db

volumes:
  postgres_data:
